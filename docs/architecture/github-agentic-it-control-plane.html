<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub-centered agentic IT control plane</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #000000;
      --color-muted:   #63666a;
      --color-accent:  #86BC25;
      --font-sans:     'Open Sans', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Secure paved road</p>
    <h1>GitHub-centered agentic IT control plane</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="github-agentic-it-control-plane-title github-agentic-it-control-plane-desc">
      <title id="github-agentic-it-control-plane-title">GitHub-centered agentic IT control plane</title>
      <desc id="github-agentic-it-control-plane-desc">Humans enter work through GitHub; Copilot agents only propose; GitHub Actions cross a narrow MCP/API gateway into enterprise systems; direct agent-to-system calls and workflow bypasses stop at the trust boundary.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#63666a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#86BC25"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1076A8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="248" y="72" width="520" height="500" rx="8"
            fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <rect x="436" y="76" width="144" height="12" rx="2" fill="#ffffff"/>
      <text x="508" y="85" fill="rgba(0,0,0,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE</text>

      <rect x="800" y="72" width="440" height="500" rx="8"
            fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <rect x="956" y="76" width="128" height="12" rx="2" fill="#ffffff"/>
      <text x="1020" y="85" fill="rgba(0,0,0,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ENTERPRISE</text>

      <!-- Arrows (behind nodes) -->
      <!-- INTAKE: Humans → Org -->
      <line x1="220" y1="216" x2="272" y2="216" stroke="#63666a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AUDIT: Org → SIEM -->
      <line x1="512" y1="216" x2="536" y2="216" stroke="#63666a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- PROPOSE: Org → Cloud agents -->
      <line x1="352" y1="256" x2="352" y2="400" stroke="#63666a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- EXECUTE: Org → Actions -->
      <path d="M 432,256 V 316 Q 432,324 440,324 H 604 Q 612,324 612,332 V 400"
            fill="none" stroke="#63666a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- REQUEST: Agents → Actions -->
      <line x1="472" y1="432" x2="544" y2="432" stroke="#63666a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- OIDC: Actions → Gateway (approved path across the boundary) -->
      <path d="M 676,400 V 312 Q 676,304 684,304 H 876 Q 884,304 884,296 V 256"
            fill="none" stroke="#86BC25" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- TOOLS: Gateway → Enterprise systems -->
      <line x1="1016" y1="216" x2="1040" y2="216" stroke="#1076A8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- RUN: Gateway → Cloud runtime -->
      <line x1="948" y1="256" x2="948" y2="400" stroke="#63666a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- FORBIDDEN: Direct API — stops at enterprise boundary -->
      <path d="M 340,464 V 484 Q 340,492 348,492 H 784"
            fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="776" y1="484" x2="792" y2="500" stroke="#000000" stroke-width="1.2"/>
      <line x1="792" y1="484" x2="776" y2="500" stroke="#000000" stroke-width="1.2"/>
      <!-- FORBIDDEN: Skip workflow — stops at enterprise boundary -->
      <path d="M 404,464 V 508 Q 404,516 412,516 H 784"
            fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="776" y1="508" x2="792" y2="524" stroke="#000000" stroke-width="1.2"/>
      <line x1="792" y1="508" x2="776" y2="524" stroke="#000000" stroke-width="1.2"/>

      <!-- Arrow labels -->
      <rect x="228" y="196" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="248" y="205" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INTAKE</text>

      <rect x="516" y="156" width="36" height="12" rx="2" fill="#ffffff"/>
      <text x="534" y="165" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIT</text>

      <rect x="360" y="322" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="386" y="331" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROPOSE</text>

      <rect x="488" y="304" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="514" y="313" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>

      <rect x="484" y="412" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="510" y="421" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

      <rect x="760" y="284" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="776" y="293" fill="#86BC25" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OIDC</text>

      <rect x="1016" y="156" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="1036" y="165" fill="#1076A8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOLS</text>

      <rect x="956" y="320" width="28" height="12" rx="2" fill="#ffffff"/>
      <text x="970" y="329" fill="#75787b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

      <rect x="528" y="472" width="72" height="12" rx="2" fill="#ffffff"/>
      <text x="564" y="481" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT API</text>

      <rect x="528" y="496" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="568" y="505" fill="#000000" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO WORKFLOW</text>

      <!-- Node: Humans -->
      <rect x="40" y="184" width="180" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="184" width="180" height="64" rx="6" fill="rgba(99,102,106,0.10)" stroke="#75787b" stroke-width="1"/>
      <rect x="48" y="192" width="24" height="12" rx="2" fill="transparent" stroke="rgba(117,120,123,0.40)" stroke-width="0.8"/>
      <text x="60" y="201" fill="#75787b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="130" y="220" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">Humans</text>
      <text x="130" y="236" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issues · PRs · CLI</text>

      <!-- Node: GitHub Organization (focal) -->
      <rect x="272" y="176" width="240" height="80" rx="6" fill="#ffffff"/>
      <rect x="272" y="176" width="240" height="80" rx="6" fill="rgba(134,188,37,0.08)" stroke="#86BC25" stroke-width="1"/>
      <rect x="280" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(134,188,37,0.50)" stroke-width="0.8"/>
      <text x="294" y="193" fill="#86BC25" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORG</text>
      <text x="392" y="216" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">GitHub Organization</text>
      <text x="392" y="232" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agents · policies · evals</text>

      <!-- Node: SIEM -->
      <rect x="536" y="176" width="200" height="80" rx="6" fill="#ffffff"/>
      <rect x="536" y="176" width="200" height="80" rx="6" fill="rgba(0,0,0,0.05)" stroke="#63666a" stroke-width="1"/>
      <rect x="544" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(99,102,106,0.50)" stroke-width="0.8"/>
      <text x="560" y="193" fill="#63666a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIEM</text>
      <text x="636" y="216" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">SIEM / telemetry</text>
      <text x="636" y="232" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">audit export</text>

      <!-- Node: Cloud agents -->
      <rect x="272" y="400" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="272" y="400" width="200" height="64" rx="6" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="280" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
      <text x="294" y="417" fill="#75787b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="372" y="436" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">Cloud agents</text>
      <text x="372" y="452" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Copilot · draft only</text>

      <!-- Node: GitHub Actions -->
      <rect x="544" y="400" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="544" y="400" width="200" height="64" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <rect x="552" y="408" width="24" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.40)" stroke-width="0.8"/>
      <text x="564" y="417" fill="#000000" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
      <text x="644" y="436" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">GitHub Actions</text>
      <text x="644" y="452" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OIDC · least privilege</text>

      <!-- Node: MCP / API gateway (focal) -->
      <rect x="816" y="176" width="200" height="80" rx="6" fill="#ffffff"/>
      <rect x="816" y="176" width="200" height="80" rx="6" fill="rgba(134,188,37,0.08)" stroke="#86BC25" stroke-width="1"/>
      <rect x="824" y="184" width="36" height="12" rx="2" fill="transparent" stroke="rgba(134,188,37,0.50)" stroke-width="0.8"/>
      <text x="842" y="193" fill="#86BC25" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="916" y="216" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">MCP / API gateway</text>
      <text x="916" y="232" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">narrow tools · kill switch</text>

      <!-- Node: Enterprise systems -->
      <rect x="1040" y="184" width="160" height="64" rx="6" fill="#ffffff"/>
      <rect x="1040" y="184" width="160" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="1048" y="192" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.22)" stroke-width="0.8"/>
      <text x="1062" y="201" fill="#75787b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="1120" y="220" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">Enterprise systems</text>
      <text x="1120" y="236" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ITSM · catalog · cloud</text>

      <!-- Node: Cloud runtime -->
      <rect x="816" y="400" width="200" height="64" rx="6" fill="#ffffff"/>
      <rect x="816" y="400" width="200" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="824" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.22)" stroke-width="0.8"/>
      <text x="838" y="417" fill="#75787b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="916" y="436" fill="#000000" font-size="12" font-weight="600" font-family="'Open Sans', sans-serif" text-anchor="middle">Cloud runtime</text>
      <text x="916" y="452" fill="#63666a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">long-running · isolated</text>

      <!-- Legend -->
      <line x1="40" y1="612" x2="1240" y2="612" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="40" y="628" fill="#63666a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="644" width="14" height="10" rx="2" fill="rgba(134,188,37,0.08)" stroke="#86BC25" stroke-width="1"/>
      <text x="60" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Focal / gate</text>

      <rect x="168" y="644" width="14" height="10" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="188" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Execution</text>

      <rect x="280" y="644" width="14" height="10" rx="2" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="300" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Draft agent</text>

      <rect x="404" y="644" width="14" height="10" rx="2" fill="rgba(0,0,0,0.05)" stroke="#63666a" stroke-width="1"/>
      <text x="424" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Store</text>

      <rect x="492" y="644" width="14" height="10" rx="2" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="512" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">External</text>

      <rect x="596" y="644" width="14" height="10" rx="2" fill="rgba(99,102,106,0.10)" stroke="#75787b" stroke-width="1"/>
      <text x="616" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Input</text>

      <line x1="680" y1="650" x2="708" y2="650" stroke="#86BC25" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="716" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Approved path</text>

      <line x1="832" y1="650" x2="860" y2="650" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="868" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">Blocked at boundary</text>

      <line x1="1040" y1="650" x2="1068" y2="650" stroke="#1076A8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="1076" y="652" fill="#63666a" font-size="8" font-family="'Open Sans', sans-serif">API / tools</text>
    </svg>
  </div>
</body>
</html>
